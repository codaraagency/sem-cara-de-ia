name: Build plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: sem-cara-de-ia-plugin
          path: dist/sem-cara-de-ia-plugin-*.zip

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sem-cara-de-ia-plugin
          path: dist
      - run: gh release create "${{ github.ref_name }}" dist/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
